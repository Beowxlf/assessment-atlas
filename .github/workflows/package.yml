name: Verify and package
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0 -r requirements-web.txt -r requirements-protocols.txt
      - name: Synthetic regression suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel, source and installers
        run: python packaging/build_artifacts.py
      - name: Check isolated wheel
        shell: python
        run: |
          import pathlib, subprocess, sys
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, 'packaging/check_wheel.py', str(wheel)], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: assessment-atlas-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
